<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us | Dig 'Em Aggies at Texas A&M</title>
  <meta name="description" content="Get in touch with the Dig 'Em Aggies — the Texas A&M Tunnel Boring Club. Reach us for inquiries, partnerships, or to learn how to get involved.">
  <link rel="icon" type="image/png" href="/assets/logo/Dig_Em_Emblem.png">
  <link rel="apple-touch-icon" href="/assets/logo/Dig_Em_Emblem.png">
  <link rel="shortcut icon" href="/assets/logo/Dig_Em_Emblem.png" type="image/png">
  <meta name="description" content="Reach out to Dig 'Em Aggies for sponsorships, partnerships, or general inquiries." />
  <link rel="stylesheet" href="/homestyle.css">
  <link rel="stylesheet" href="/pages/sponsorpage/sponsorstyle.css">
  <link rel="stylesheet" href="contactstyle.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="/pages/sponsorpage/sponsor.js" defer></script>
  <script src="/js/menu-toggle.js" defer></script>
  <script src="contact.js" defer></script>
  <script src="/transition.js" defer></script>
  <script src="/home.js" defer></script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Dig 'Em Aggies",
          "url": "https://tamu-nabc.com",
          "logo": "https://tamu-nabc.com/assets/logo/Dig_Em_Emblem.png"
        },
        {
          "@type": "WebPage",
          "name": "Contact Us",
          "url": "https://tamu-nabc.com/contact",
          "description": "Get in touch with the Dig 'Em Aggies at Texas A&M University for collaboration, sponsorships, or media inquiries."
        },
        {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://tamu-nabc.com/"
            },
            {
              "@type": "ListItem",
              "position": 2,
              "name": "Contact",
              "item": "https://tamu-nabc.com/contact"
            }
          ]
        }
      ]
    }
    </script>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container">
      <nav>
        <div class="brand">
          <a href="/"><img src="/assets/logo/Dig_Em_Logo.png" alt="Dig 'Em Aggies logo" /></a>
        </div>

        <button class="menu-toggle" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav-links" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/sponsor">Sponsors</a>
          <a href="/about">About</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <section id="contact" class="contact-section">
      <div class="container">
        <h1>Contact Us</h1>

        <form id="sponsorForm" class="contact-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required>
          </div>
    
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Your Email" required>
          </div>
    
          <div class="form-group">
            <label for="company">Company / Organization</label>
            <input type="text" id="company" name="company" placeholder="Your Company Name" required>
          </div>
    
          <div class="form-group">
            <label for="message">Message / Inquiry</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell us about your inquiry" required></textarea>
          </div>
    
          <button type="submit" class="btn-submit">Send Inquiry</button>
    
          <p id="formMessage" class="form-message"></p>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <div class="footer-left">
          <a href="/"><img src="/assets/logo/Dig_Em_Logo.png" alt="Dig 'Em Aggies logo" /></a>
        <p>
          Texas A&M NABC Team<br>
          College Station, TX<br>
          <a href="mailto:digem.team@gmail.com">Digem.team@gmail.com</a>
        </p>
      </div>

      <div class="footer-right">
        <h3>Follow Us</h3>
        <div class="social-links">
          <a href="https://www.instagram.com/dig.em.aggies/" target="_blank" aria-label="Instagram">
            <i class="fab fa-instagram"></i>
          </a>
          <a href="https://www.linkedin.com/company/tamu-dig-em-aggies/" target="_blank" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; 2025 Texas A&M NABC. All rights reserved.</p>
    </div>
  </footer>

  <script src="contact.js"></script>
</body>
</html>
